<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08111f">
    <title>MRDVS 手持采集</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/vendor/chart.umd.js"></script>
    <script type="module" src="/static/js/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">MRDVS COLLECTOR</p>
        <h1>手持数据采集</h1>
      </div>
      <div class="connection-pill" id="connection-state" data-state="waiting">
        <span class="pulse-dot"></span><span>正在连接</span>
      </div>
    </header>

    <nav class="tab-bar" aria-label="主功能">
      <button class="tab-button active" data-tab="collect">采集</button>
      <button class="tab-button" data-tab="live">实时数据</button>
      <button class="tab-button" data-tab="bags">数据包</button>
      <button class="tab-button" data-tab="settings">设置</button>
    </nav>

    <main>
      <section class="tab-panel active" data-panel="collect">
        <div id="system-status" class="status-grid" aria-live="polite">
          <article class="status-card"><span>驱动</span><strong id="driver-status">未知</strong></article>
          <article class="status-card"><span>录制</span><strong id="recording-status">未知</strong></article>
          <article class="status-card"><span>点云</span><strong id="cloud-status">-- Hz</strong></article>
          <article class="status-card"><span>IMU</span><strong id="imu-status">-- Hz</strong></article>
          <article class="status-card wide"><span>可用空间</span><strong id="disk-status">--</strong></article>
        </div>

        <article class="panel hero-panel">
          <div class="panel-heading">
            <div><p class="eyebrow">COLLECTION SESSION</p><h2>采集会话</h2></div>
            <span id="active-bag" class="soft-badge">未录制</span>
          </div>
          <label for="bag-name">数据包名称</label>
          <input id="bag-name" maxlength="80" autocomplete="off" placeholder="例如：走廊采集_01">
          <p class="field-help">支持中文、字母、数字、短横线和下划线，不会自动改名。</p>
          <label class="toggle-row" for="record-with-driver">
            <input id="record-with-driver" type="checkbox">
            <span><strong>随驱动完整录制全部话题</strong><small>网页点云抽样不会影响 rosbag</small></span>
          </label>
          <div id="driver-control" class="button-grid">
            <button id="start-driver" class="primary">启动驱动</button>
            <button id="stop-driver" class="danger" disabled>停止驱动</button>
            <button id="start-recording" class="secondary" disabled>开始录制</button>
            <button id="stop-recording" class="secondary" disabled>停止录制</button>
          </div>
          <p id="session-message" class="message-line" aria-live="polite"></p>
        </article>

        <article class="panel">
          <div class="panel-heading"><h2>运行日志</h2><button id="refresh-logs" class="ghost compact">刷新</button></div>
          <pre id="log-view">等待服务日志…</pre>
        </article>
      </section>

      <section class="tab-panel" data-panel="live">
        <article class="panel viewer-panel">
          <div class="panel-heading">
            <div><p class="eyebrow">POINT CLOUD</p><h2>三维点云</h2></div>
            <div><span id="point-count" class="soft-badge">0 点</span><button id="reset-view" class="ghost compact">复位视角</button></div>
          </div>
          <div id="pointcloud-view" aria-label="MRDVS 三维点云"></div>
        </article>
        <article id="imu-view" class="panel">
          <div class="panel-heading">
            <div><p class="eyebrow">IMU · LAST 10 SECONDS</p><h2>惯性数据</h2></div>
            <span id="imu-current" class="soft-badge">等待数据</span>
          </div>
          <div class="chart-grid">
            <div class="chart-wrap"><canvas id="acceleration-chart"></canvas></div>
            <div class="chart-wrap"><canvas id="angular-chart"></canvas></div>
          </div>
        </article>
      </section>

      <section class="tab-panel" data-panel="bags">
        <article class="panel">
          <div class="panel-heading">
            <div><p class="eyebrow">ROS 2 BAGS</p><h2>数据包</h2></div>
            <button id="refresh-bags" class="ghost compact">刷新</button>
          </div>
          <div id="bag-list" class="bag-list"><p class="empty-state">正在读取数据包…</p></div>
        </article>
      </section>

      <section class="tab-panel" data-panel="settings">
        <form id="settings-form" class="panel settings-grid">
          <div class="panel-heading full-row"><div><p class="eyebrow">DEVICE SETTINGS</p><h2>设备设置</h2></div></div>
          <label>热点名称<input id="hotspot-ssid" maxlength="32" value="MRDVS-Collector"></label>
          <label>新热点密码<input id="hotspot-password" type="password" minlength="8" maxlength="63" placeholder="留空表示不修改"></label>
          <label>雷达 IP<input id="radar-ip" inputmode="decimal"></label>
          <label>IMU 角速度量程
            <select id="imu-range"><option value="0">0</option><option value="1">1</option><option value="2">2（默认）</option><option value="3">3</option><option value="4">4</option></select>
          </label>
          <label class="full-row">数据包根目录<input id="bag-root"></label>
          <label class="toggle-row full-row" for="autostart-enabled">
            <input id="autostart-enabled" type="checkbox">
            <span><strong>下次开机自动启动热点和网页</strong><small>关闭不会停止当前服务</small></span>
          </label>
          <div class="full-row"><button type="submit" class="primary">保存设置</button></div>
        </form>
      </section>
    </main>

    <dialog id="delete-dialog">
      <form method="dialog" class="dialog-card">
        <h2>删除数据包</h2>
        <p>此操作不可恢复。请输入完整名称 <strong id="delete-target"></strong>：</p>
        <input id="delete-confirmation" autocomplete="off">
        <div class="button-grid two"><button value="cancel" class="ghost">取消</button><button id="confirm-delete" value="default" class="danger">确认删除</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
